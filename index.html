<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- Critical for iOS Safari: Prevents zooming/shaking and white screen crashes -->
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">



  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="naji_portfolio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Critical iOS Safari Fixes -->
  <style>
    html {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    body {
      /* Prevent rubber-banding/bouncing */
      overscroll-behavior: none;
      background-color: #0F172A;
      /* Match App Background */

      /* Force strict viewport size */
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      margin: 0;
      padding: 0;
      overflow: hidden;

      /* Disable touch callouts */
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    /* specific fix for flutter view */
    #flutter_container {
      width: 100%;
      height: 100%;
    }
  </style>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>naji_portfolio</title>
  <link rel="manifest" href="manifest.json">
</head>

<body>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
