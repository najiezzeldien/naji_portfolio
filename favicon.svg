<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg-light" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="52%" stop-color="#1F4E79"/>
      <stop offset="100%" stop-color="#143352"/>
    </linearGradient>
    <linearGradient id="bg-dark" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="55%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#173A60"/>
    </linearGradient>
    <radialGradient id="glow" cx="20" cy="10" r="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#93C5FD" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="squircle">
      <rect x="2" y="2" width="60" height="60" rx="15"/>
    </clipPath>
    <style>
      .tile { fill: url(#bg-light); }
      .rim { stroke: #FFFFFF; stroke-opacity: 0.18; }
      @media (prefers-color-scheme: dark) {
        .tile { fill: url(#bg-dark); }
        .rim { stroke: #93C5FD; stroke-opacity: 0.28; }
      }
    </style>
  </defs>

  <g clip-path="url(#squircle)">
    <rect class="tile" x="2" y="2" width="60" height="60" rx="15"/>
    <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#glow)"/>
    <rect class="rim" x="2.5" y="2.5" width="59" height="59" rx="14.5" stroke-width="1"/>
  </g>

